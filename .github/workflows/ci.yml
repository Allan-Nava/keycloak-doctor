name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - name: Test with coverage
        run: |
          go test -coverprofile=cover.out ./...
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.out | tail -1
      - run: go build ./...
      # Anti-divergence gate: docs/rules.md is a projection of the rule catalogue
      # compiled into the binary. Regenerating it must be a no-op, or a rule can
      # land while the documentation still describes the old set.
      - name: Rule docs are up to date
        run: |
          go run ./cmd/gen-docs
          if ! git diff --quiet -- docs/rules.md; then
            echo "::error::docs/rules.md is stale — run 'go run ./cmd/gen-docs' and commit the result"
            git diff -- docs/rules.md
            exit 1
          fi
      # The site is generated from the documents and the catalogue, so a change that
      # breaks the generator has to fail here rather than on the Pages deploy.
      - name: Documentation site builds
        run: go run ./cmd/gen-site --out "$RUNNER_TEMP/site"
      # The audit must be able to tell a hardened realm from a broken one, end to
      # end, through the real binary and not just in unit tests.
      - name: Smoke test the built binary
        run: |
          go build -o keycloak-doctor ./cmd/keycloak-doctor
          ./keycloak-doctor rules > /dev/null
          ./keycloak-doctor audit testdata/hardened-realm.json --exit-on warn --no-color
          if ./keycloak-doctor audit testdata/insecure-realm.json --exit-on bad --no-color > /dev/null; then
            echo "::error::--exit-on bad did not gate on the insecure fixture"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: govulncheck (gate)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      # golangci-lint is built from source with the toolchain of this job, not
      # downloaded: a prebuilt binary is compiled against one Go version and
      # panics when it has to load the standard library of a newer one ("file
      # requires newer Go version go1.26, application built with go1.25"). With
      # setup-go on "stable" that breakage arrives on its own, on a run that
      # changed nothing.
      - name: golangci-lint (gate)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint --version
          golangci-lint run
