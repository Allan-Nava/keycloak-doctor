name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="keycloak-doctor_${version}_${GOOS}_${GOARCH}"
          bin="keycloak-doctor"
          if [ "$GOOS" = "windows" ]; then bin="keycloak-doctor.exe"; fi
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/$name/$bin" ./cmd/keycloak-doctor
          cp README.md LICENSE COMMERCIAL.md CHANGELOG.md "dist/$name/"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -qr "${name}.zip" "$name"
          else
            tar -czf "${name}.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          body: |
            See [CHANGELOG.md](https://github.com/Allan-Nava/keycloak-doctor/blob/main/CHANGELOG.md) for what changed.

            Verify a download against `checksums.txt`:

            ```bash
            sha256sum -c checksums.txt --ignore-missing
            ```
          generate_release_notes: true

  # The Homebrew tap is this repository, so a release has to move the formula onto
  # the tag it just published — otherwise `brew upgrade` keeps building the old
  # one. Pushing several tags at once starts several runs, hence the guard and the
  # serialised group: the formula only ever moves forward.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: homebrew-formula
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Point the formula at ${{ github.ref_name }}
        run: |
          formula=Formula/keycloak-doctor.rb
          current="$(sed -n 's/.*tag: *"v\([^"]*\)".*/\1/p' "$formula")"
          new="${GITHUB_REF_NAME#v}"
          newest="$(printf '%s\n%s\n' "$current" "$new" | sort -V | tail -1)"
          if [ "$current" = "$new" ] || [ "$newest" != "$new" ]; then
            echo "formula is at v$current; not moving it to v$new"
            exit 0
          fi
          sed -i \
            -e "s|tag: *\"v[^\"]*\"|tag:      \"${GITHUB_REF_NAME}\"|" \
            -e "s|revision: *\"[0-9a-f]*\"|revision: \"${GITHUB_SHA}\"|" \
            "$formula"
          # Not "git diff --quiet && {…}": under bash -e a compound whose last
          # command is a failing test fails the whole step.
          if git diff --quiet -- "$formula"; then
            echo "formula unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: formula Homebrew a ${GITHUB_REF_NAME}" -- "$formula"
          git push origin HEAD:main
          echo "- formula moved to \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
